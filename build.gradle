plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"aynthor_secondscreen_v1_21" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		client {
			// Opt-in auto-join, so a dev client can be driven end to end
			// without anyone clicking through the main menu:
			//
			//   ./gradlew runClient -PquickPlay="New World"
			//
			// This is the only practical way to exercise the socket protocol
			// against a real world from a script -- the launcher on the target
			// device renders Minecraft through a virtual-cursor overlay that
			// synthesized touch events move but never click, so menu
			// automation there is a dead end.
			//
			// Property-gated rather than always-on: a bare `runClient` should
			// still drop you at the menu like every other Fabric project.
			if (project.hasProperty("quickPlay")) {
				programArgs "--quickPlaySingleplayer", project.property("quickPlay").toString()
			}
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Deliberately *no* withSourcesJar(). The template ships it, and it put a
	// second jar next to the mod in build/libs -- which matters here because
	// installing this mod means picking a file out of that folder in a
	// launcher's import dialog on a handheld. A sources jar imported by mistake
	// is not an error anyone gets told about: it simply doesn't load, and the
	// second screen stays dark with nothing to explain why. One build, one jar.
	//
	// The sources are on GitHub; nobody needs them zipped beside the release.
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
